name: Build Stock Tracker APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o Stock_Tracker_v1_Android_Project.zip -d StockTracker

      - name: Apply latest source files
        run: |
          cp MainActivity.kt StockTracker/app/src/main/java/com/stocktracker/app/MainActivity.kt
          cp MarketDataService.kt StockTracker/app/src/main/java/com/stocktracker/app/MarketDataService.kt
          cp AndroidManifest.xml StockTracker/app/src/main/AndroidManifest.xml
          cp styles.xml StockTracker/app/src/main/res/values/styles.xml
          cp build.gradle StockTracker/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fix JVM compatibility
        working-directory: StockTracker
        run: |
          cat >> app/build.gradle <<'EOF'

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: StockTracker
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stock-Tracker-APK
          path: StockTracker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
